name: Verify game
on: [push, pull_request]
jobs:
  build-and-play:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: live
      - run: npm run test:browser --prefix live
      - run: npm run test:3d --prefix live
      - run: npm run test:models --prefix live
      - run: python3 live/tools/audit-medieval-castles.py
      - run: npm run test:fortresses --prefix live
      - run: node tools/terrain-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-3d-gameplay-captures
          path: |
            live/artifacts/full3d-*.png
            live/artifacts/full3d-report.json
            live/artifacts/grass-*.png
            live/artifacts/grass-report.json
  hud-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/hud-check.mjs
        working-directory: live
      - run: node tools/audio-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-hud-browser-captures
          path: |
            live/artifacts/grok-hud-*.png
            live/artifacts/hud-report.json
            live/artifacts/webkit-audio-report.json
