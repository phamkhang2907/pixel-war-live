name: Verify game
on: [push, pull_request]
env:
  # Bound Mesa software raster workers on CI; browsers still assert all GL errors.
  LP_NUM_THREADS: 2
  # Avoid Linux WebKit/ANGLE compositor texture-copy errors on headless Mesa.
  # WebGL, PCF shadows and HDR bloom remain enabled and strictly verified.
  WEBKIT_DISABLE_COMPOSITING_MODE: 1
jobs:
  build-and-play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: live
      - run: npm run test:browser --prefix live
      - run: npm run test:3d --prefix live
      - run: npm run test:models --prefix live
      - run: python3 live/tools/audit-medieval-castles.py
      - run: npm run test:fortresses --prefix live
      - run: node tools/terrain-check.mjs
        working-directory: live
      - run: node tools/version-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-3d-gameplay-captures
          path: |
            live/artifacts/full3d-*.png
            live/artifacts/full3d-report.json
            live/artifacts/environment-*.png
            live/artifacts/environment-report.json
            live/artifacts/build-version-*.png
            live/artifacts/build-version-report.json
  hud-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/hud-check.mjs
        working-directory: live
      - run: node tools/audio-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-hud-browser-captures
          path: |
            live/artifacts/grok-hud-*.png
            live/artifacts/hud-report.json
            live/artifacts/webkit-audio-report.json
  swarm-and-music:
    # Pin the Mesa/WebKit environment; ubuntu-latest now rolls through Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/swarm-simulation.mjs
        working-directory: live
      - run: node tools/swarm-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 SWARM_ENGINE=webkit SWARM_COUNTS=200 node tools/swarm-check.mjs
        working-directory: live
      - run: node tools/music-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 MUSIC_ENGINE=webkit node tools/music-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-and-uploaded-music-captures
          path: |
            live/artifacts/swarm-*.png
            live/artifacts/swarm-report*.json
            live/artifacts/swarm-simulation.json
            live/artifacts/music-*.png
            live/artifacts/music-report*.json

  public-live-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/deployment-benchmark.mjs
        working-directory: live
      - run: node tools/upgrade-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 UPGRADE_ENGINE=webkit node tools/upgrade-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-demo-owner-camera-and-grass
          path: |
            live/artifacts/upgrade-*.png
            live/artifacts/upgrade-report*.json
            live/artifacts/deployment-throughput.json

  monster-gifts-and-defenders:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/monster-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 MONSTER_ENGINE=webkit node tools/monster-check.mjs
        working-directory: live
      - run: node tools/native-summons-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 NATIVE_ENGINE=webkit node tools/native-summons-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-gifts-models-and-castle-defenders
          path: |
            live/artifacts/monsters-*.png
            live/artifacts/monsters-*-report.json
            live/artifacts/native-*.png
            live/artifacts/native-*-report.json

  fantasy-visual-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/visual-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 LP_NUM_THREADS=2 VISUAL_ENGINE=webkit node tools/visual-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-lighting-nature-vfx-and-quality
          path: |
            live/artifacts/visual-after-*.png
            live/artifacts/visual-after-*-report.json

  heart-war-and-uploaded-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: live
      - run: node tools/warfare-check.mjs
        working-directory: live
      - run: LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1 WARFARE_ENGINE=webkit node tools/warfare-check.mjs
        working-directory: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heart-war-flybys-and-original-mp3s
          path: |
            live/artifacts/warfare-*.png
            live/artifacts/warfare-*-report.json
